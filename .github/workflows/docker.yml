name: 构建 RuleBox 镜像

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: 生成镜像标签
        id: image
        shell: bash
        run: |
          timestamp=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M')
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'ref=%s:%s-%s-%s\nlatest=%s:latest\n' \
            "$image" "$timestamp" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$image" >> "$GITHUB_OUTPUT"

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 使用触发提交的 Git 上下文，不把工作目录中的临时文件带入镜像。
      - name: 构建并发布镜像
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 显示已发布的镜像
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: printf '已发布镜像：`%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
